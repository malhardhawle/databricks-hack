# Databricks Asset Bundle for the CNRL Acquisition Explorer app.
#   cd app/frontend && npm run build        # dist/ must exist; it is gitignored but synced (see sync.include)
#   databricks bundle deploy -p hack        # create/update the app and upload ./app
#   databricks bundle run cnrl_acquisition_explorer -p hack   # deploy the uploaded source and start the app
bundle:
  name: cnrl-acquisition-explorer

variables:
  genie_space_id:
    description: Genie space created by scripts/genie_space.py (also recorded in app/genie_space.json)
    default: 01f1d2fee6fd12abbd56ed699d055599
  warehouse_id:
    description: SQL warehouse the Genie space runs its queries on
    default: 42b00ac711df45f6

sync:
  include:
    - app/frontend/dist/**

resources:
  apps:
    cnrl_acquisition_explorer:
      name: cnrl-acquisition-explorer
      description: "CNRL acquisition explorer: Petrinex 2024-25 candidates, lasso map and ranking, served from Lakebase"
      source_code_path: ./app
      resources:
        - name: database
          description: Lakebase database with the app tables (shm_hack.acq copies)
          database:
            instance_name: cnrl-acq
            database_name: acq
            permission: CAN_CONNECT_AND_CREATE
        - name: genie-space
          description: Genie agent behind the Ask Genie panel
          genie_space:
            name: CNRL Acquisition Explorer - Petrinex Genie
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: sql-warehouse
          description: Warehouse Genie runs its SQL on
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

targets:
  prod:
    default: true
    workspace:
      host: https://adb-7808899982160538.18.azuredatabricks.net
